<!doctype html>
<html><head><meta charset="utf-8"><title>The failover drill — a sequence diagram</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #FFFFFF; color: #1A1A1A;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { padding: 34px 40px 30px; }
  h1 {
    font-size: 30px; font-weight: 700; color: #0B3D91; margin: 0 0 2px 0;
    letter-spacing: -0.2px;
  }
  .sub { font-size: 15px; color: #555555; margin: 0 0 22px 0; }
  .rule { height: 5px; background: #0B3D91; border-radius: 3px; margin: 0 0 22px 0; }
  code, .mono { font-family: Consolas, "DejaVu Sans Mono", monospace; }

  /* ---- boxes ---- */
  .panel {
    border: 1px solid #D5D5D5; border-radius: 10px; background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .panel-head {
    background: #0B3D91; color: #FFFFFF; border-radius: 9px 9px 0 0;
    padding: 8px 14px; font-size: 13px; font-weight: 600; letter-spacing: .3px;
  }
  .panel-body { padding: 14px; }

  .chip {
    border: 1px solid #D5D5D5; border-radius: 8px; background: #FFFFFF;
    padding: 8px 10px 9px 10px; position: relative; width: 302px;
  }
  .chip .n {
    display: inline-block; width: 20px; height: 20px; border-radius: 50%;
    background: #0B3D91; color: #FFFFFF; font-size: 11px; font-weight: 700;
    text-align: center; line-height: 20px; margin-right: 6px;
  }
  .chip .t { font-size: 13.5px; font-weight: 600; color: #1A1A1A; }
  .chip .c {
    font-family: Consolas, monospace; font-size: 10.5px; color: #333333;
    background: #F2F3F5; border-radius: 4px; padding: 4px 6px; margin-top: 6px;
    line-height: 1.35; word-break: break-word;
  }
  .chip.gate { border-color: #1B6B3A; background: #E9F5EE; }
  .chip.gate .n { background: #1B6B3A; }
  .chip .gatebadge {
    float: right; font-size: 9.5px; font-weight: 700; letter-spacing: .6px;
    color: #1B6B3A; border: 1px solid #1B6B3A; border-radius: 3px;
    padding: 1px 5px; margin-top: 2px;
  }

  .arrow { text-align: center; color: #0B3D91; font-size: 20px; line-height: 1;
           margin: 8px 0; }

  .site {
    border: 1px solid #D5D5D5; border-radius: 10px; overflow: hidden; width: 640px;
  }
  .site .hd { padding: 8px 14px; color: #FFFFFF; font-size: 14px; font-weight: 600; }
  .site.prod .hd { background: #0B3D91; }
  .site.dr   .hd { background: #2C6E49; }
  .site .bd { padding: 12px 14px 14px 14px; }
  .row {
    font-family: Consolas, monospace; font-size: 11.5px; color: #333333;
    background: #F2F3F5; border-radius: 4px; padding: 5px 8px; margin-bottom: 6px;
    line-height: 1.4;
  }
  .row .lbl { color: #555555; }
  .answer {
    font-size: 14px; font-weight: 600; color: #0B3D91; margin-top: 9px;
    font-family: Consolas, monospace;
  }
  .site.dr .answer { color: #2C6E49; }

  .note {
    background: #EAF1F8; border-left: 4px solid #0B3D91; border-radius: 0 6px 6px 0;
    padding: 9px 13px; font-size: 12.5px; color: #1A1A1A; line-height: 1.45;
  }
  .note b { color: #0B3D91; }

  .sheet { padding: 34px 40px 30px; }
  svg { display: block; }
</style></head>
<body><div class="sheet">
  <h1>The failover drill — a sequence diagram</h1>

nd this demo never gives the deploy user root.</text></svg>
