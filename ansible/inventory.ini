# Inventory for the PROD/DR RHEL MCP pipeline.
#
# Every site is driven as its OWN non-root user with rootless podman:
#   PROD (.105) -> rhai  (uid 1001)
#   DR   (.104) -> dr    (uid 1001)
#
# The role never uses `become`, so neither user needs to be in the wheel
# group and no sudo password is ever needed on the target.
#
# ansible_python_interpreter is PINNED, not auto-discovered: RHEL 8 ships
# Python 3.6 as /usr/bin/python3, but ansible-core >= 2.15 requires a target
# interpreter of 3.7 or newer. Both sites therefore run the `python39`
# package, and the inventory points at it explicitly so the controller never
# guesses differently on each host.

[mcp_prod]
192.168.147.105 ansible_user=rhai ansible_python_interpreter=/usr/bin/python3.9

[mcp_dr]
192.168.147.104 ansible_user=dr ansible_python_interpreter=/usr/bin/python3.9

[mcp_sites:children]
mcp_prod
mcp_dr
