[defaults]
inventory = ./inventory.ini
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
# The pipeline's SSH key. The path is relative to the CONTROLLER's home, so
# the same inventory works from the Jenkins container (/var/jenkins_home) and
# from a developer machine.
#
# The ini key is `private_key_file` — the ssh connection plugin's option is
# named `private_key_file` and its ini section is [defaults]. (The
# `ansible_ssh_private_key_file` name only works as a host variable.)
private_key_file = ~/.ssh/id_rhai108_rsa
# Ansible 2.9 on the control host is noisy about collections it cannot find;
# the roles here only use modules that ship with ansible-core.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
